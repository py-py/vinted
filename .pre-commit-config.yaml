default_install_hook_types: [pre-commit, prepare-commit-msg]
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.8
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: prepend-branch-name
        name: prepend branch name to commit message
        entry: .githooks/prepend-branch-name.sh
        language: script
        stages: [prepare-commit-msg]
        always_run: true
