[project]
name = "vinted"
version = "0.1.0"
description = "Scrape Vinted favourites and analyse them with Gemini."
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4==4.14.3",
    "google-cloud-firestore==2.27.0",
    "google-cloud-storage==3.10.1",
    "google-genai==1.47.0",
    "httpx==0.28.1",
    "pydantic==2.12.5",
    "python-dotenv==1.2.1",
]

[dependency-groups]
dev = [
    "pre-commit==4.3.0",
    "ruff==0.15.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 99
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
]
ignore = ["UP045"]

[tool.ruff.lint.isort]
force-single-line = true