[project]
name = "vinted"
version = "0.1.0"
description = "Scrape Vinted favourites and analyse them with Gemini."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "anthropic>=0.49",
    "asyncpg>=0.30",
    "beautifulsoup4==4.14.3",
    "fastapi>=0.115",
    "google-cloud-storage>=2.18",
    "greenlet>=3.0",
    "google-genai==1.47.0",
    "httpx==0.28.1",
    "pydantic==2.12.5",
    "pydantic-settings>=2.7",
    "python-dotenv==1.2.1",
    "sqladmin>=0.20",
    "sqlmodel>=0.0.22",
    "uvicorn>=0.34",
]

[dependency-groups]
dev = [
    "pre-commit==4.3.0",
    "ruff==0.15.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 99
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
]
ignore = ["UP045"]

[tool.ruff.lint.isort]
force-single-line = true